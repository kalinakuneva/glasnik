<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гласник — Речник</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dictionary">

  <div id="site-header"></div>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Речник</h1>
        <p>Диалектна лексика от българските говори в Банат, Бесарабия и Северното Причерноморие. Засега: речникът на Зоя Барболова за говора на Николаевска Терновка (букви А–Б), кодиран в TEI XML.</p>
        <p class="small" id="dictionary-source"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="toolbar toolbar-3">
          <div class="toolbar-search">
            <label class="field-label" for="word-search">Търсене</label>
            <input class="input" type="search" id="word-search" placeholder="Дума, значение или пример (без ударения)…">
          </div>
          <div>
            <label class="field-label" for="word-place">Населено място</label>
            <select class="select" id="word-place"><option value="">Всички места</option></select>
          </div>
          <div>
            <label class="field-label" for="word-pos">Част на речта</label>
            <select class="select" id="word-pos"><option value="">Всички</option></select>
          </div>
        </div>

        <div class="dictionary-layout">
          <div>
            <p class="results-info" id="word-count" aria-live="polite"></p>
            <ul class="word-list" id="word-list" aria-label="Списък с думи"></ul>
          </div>

          <article class="card entry-card" id="entry-card" aria-live="polite"></article>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/dictionary-data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dictionary.js"></script>
</body>
</html>
