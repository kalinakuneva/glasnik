<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гласник — Речник</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dictionary">

  <div id="site-header"></div>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Речник</h1>
        <p>Диалектна и битова лексика от говорите на банатските и бесарабските българи. Примерни речникови единици за демонстрация.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="toolbar toolbar-3">
          <div class="toolbar-search">
            <label class="field-label" for="word-search">Търсене</label>
            <input class="input" type="search" id="word-search" placeholder="Търсене на дума…">
          </div>
          <div>
            <label class="field-label" for="word-region">Регион</label>
            <select class="select" id="word-region"><option value="">Всички региони</option></select>
          </div>
          <div>
            <label class="field-label" for="word-tag">Етикет</label>
            <select class="select" id="word-tag"><option value="">Всички етикети</option></select>
          </div>
        </div>

        <div class="dictionary-layout">
          <div>
            <p class="results-info" id="word-count" aria-live="polite"></p>
            <ul class="word-list" id="word-list" aria-label="Списък с думи"></ul>
          </div>

          <article class="card entry-card" id="entry-card" aria-live="polite"></article>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dictionary.js"></script>
</body>
</html>
